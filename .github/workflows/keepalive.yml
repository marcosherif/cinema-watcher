name: Keep Alive

# GitHub disables scheduled workflows after ~60 days of no repo activity.
# This makes a tiny automated commit weekly so your watcher schedule never
# gets paused. It touches a single timestamp file — nothing else.

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write            # allow the bot to push the tiny commit

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch heartbeat file & commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep scheduled workflows alive" || echo "nothing to commit"
          git push
