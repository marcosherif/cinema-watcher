name: VOX Showtimes Watcher

on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes
  workflow_dispatch:            # run on demand from the Actions tab
    inputs:
      debug:
        description: "Save page screenshot/text artifacts"
        type: boolean
        default: false
      dates:
        description: "Force dates YYYYMMDD (comma-separated), blank = auto next-week"
        default: ""

concurrency:
  group: vox-watcher
  cancel-in-progress: false

jobs:
  check:
    # Pinned to 22.04: on ubuntu-latest (24.04) libasound2 was renamed, breaking
    # Playwright 1.44's dependency install.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip + Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: vox-deps-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore alert-state
        uses: actions/cache@v4
        with:
          path: state.json
          key: vox-state-${{ github.run_id }}
          restore-keys: |
            vox-state-

      - name: Run one check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          VOX_SEATS:          "2"
          VOX_MODE:           "notify"
          VOX_STATE_FILE:     "state.json"
          VOX_DATES:          ${{ github.event.inputs.dates }}
        run: |
          python watcher.py --once --state-file state.json \
            ${{ github.event.inputs.debug == 'true' && '--debug' || '' }}

      - name: Upload debug artifacts (screenshots/text)
        if: ${{ always() && github.event.inputs.debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vox-debug
          path: |
            debug_*.png
            debug_*.txt
          if-no-files-found: ignore
